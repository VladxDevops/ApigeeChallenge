repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/semgrep/semgrep
    rev: v1.95.0
    hooks:
      - id: semgrep
        name: semgrep-security
        entry: semgrep --config=auto --severity ERROR --error
        language: python
        files: >-
          (\.py|\.js|\.ts|\.tf|\.yaml|\.yml|\.json)$

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.320
    hooks:
      - id: checkov
        name: checkov-terraform
        entry: checkov -d . --framework terraform --quiet
        language: python
        pass_filenames: false
        files: \.tf$

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: bash -lc 'cd platform/GCP/terraform && terraform fmt -recursive'
        language: system
        files: \.tf$

      - id: terraform-validate
        name: terraform validate
        entry: bash -lc 'cd platform/GCP/terraform && terraform init -backend=false >/dev/null && terraform validate'
        language: system
        files: \.tf$
        pass_filenames: false
