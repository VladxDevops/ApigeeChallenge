---
# Dev environment values. Terraform-owned values are resolved from Terraform outputs at runtime.

compute_project_id: ""
apigee_org: ""
compute_region: "us-south1"

apigee_environment_name: dev
apigee_envgroup_name: dev-group
apigee_instance_name: apigee-instance-us-south1

apigee_service_account_email: ""
apigee_endpoint_attachment_host: ""

# Northbound test
envgroup_hostname: api.example.com
# Reserved regional IP. Leave empty to read it from `terraform output -raw northbound_ip`.
northbound_ip: ""
# Dev northbound testing may use a test certificate; the southbound ILB certificate is separately the dev-only self-signed certificate.
curl_insecure: true

# Cloud Run service whose logs are checked after the test call.
cloud_run_service_name: hello-container-backend
