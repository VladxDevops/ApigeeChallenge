---
# Shared preflight.
#   preflight_commands (optional): executables that must be on PATH. Default: gcloud, curl.
#   required_vars (group_vars/all.yml): must be set and must not contain PLACEHOLDER.

- name: Check required executables are installed
  ansible.builtin.shell: "command -v {{ item }}"
  args:
    executable: /bin/sh
  loop: "{{ preflight_commands | default(['gcloud', 'curl']) }}"
  register: preflight_which
  changed_when: false
  failed_when: false
  check_mode: false

- name: Stop if an executable is missing
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: "'{{ item.item }}' is not installed or not on PATH. Install it and run again."
    quiet: true
  loop: "{{ preflight_which.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Stop if a required variable is empty or still a PLACEHOLDER
  ansible.builtin.assert:
    that:
      - vars[item] is defined
      - (vars[item] | string | length) > 0
      - "'PLACEHOLDER' not in (vars[item] | string)"
    fail_msg: "Variable '{{ item }}' is empty or still a PLACEHOLDER. Set it in inventory/group_vars/dev.yml (or pass -e)."
    quiet: true
  loop: "{{ required_vars }}"
